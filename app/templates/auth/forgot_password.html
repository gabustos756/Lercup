{% extends "base.html" %}
{% block title %}Recuperar contraseña - Lercup Torneos{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <div class="auth-header">
            <h1>Recuperar contraseña</h1>
            <p>Ingresá el email de tu cuenta. Te enviaremos un enlace para restablecerla.</p>
        </div>

        <form action="/auth/forgot-password" method="post">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="tu@correo.com" required value="{{ email or '' }}">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Enviar enlace
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            <a href="/auth/login" style="color: var(--primary-light); font-weight: 600;">Volver al inicio de sesión</a>
        </div>
    </div>
</div>
{% endblock %}
