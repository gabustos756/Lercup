{% extends "base.html" %}
{% block title %}Iniciar Sesión - Lercup Torneos{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <div class="auth-header">
            <h1>Iniciar Sesión</h1>
            <p>Bienvenido de nuevo a Lercup. Ingresa tus datos.</p>
        </div>

        <form action="/auth/login" method="post">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com" required value="{{ email or '' }}">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Ingresar</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            ¿No tienes cuenta? <a href="/auth/register" style="color: var(--primary-light); font-weight: 600;">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}
