{% extends "base.html" %}
{% block title %}Registrarse - Lercup Torneos{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <div class="auth-header">
            <h1>Crear Cuenta</h1>
            <p>Únete como jugador para competir y seguir torneos.</p>
        </div>

        <form action="/auth/register" method="post">
            <div class="form-group">
                <label for="full_name">Nombre Completo</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Ej. Roger Federer" required value="{{ full_name or '' }}">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com" required value="{{ email or '' }}">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirmar Contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Registrarse</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            ¿Ya tienes cuenta? <a href="/auth/login" style="color: var(--primary-light); font-weight: 600;">Inicia sesión aquí</a>
        </div>
    </div>
</div>
{% endblock %}
