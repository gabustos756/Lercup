{# prefix: unique id (e.g. match.id); value_label / value_url optional #}
<div class="location-picker" data-location-picker>
    <div class="form-group">
        <label for="location_label_{{ prefix }}">
            Lugar <span class="form-label-optional">(opcional)</span>
        </label>
        <input type="text"
               id="location_label_{{ prefix }}"
               name="location_label"
               class="form-control proposal-location-input location-picker-label"
               placeholder="Ej: Cancha 3, Club Laler, La Plata"
               {% if value_label %}value="{{ value_label }}"{% endif %}>
        <p class="proposal-label-hint">
            Escribí el nombre del lugar y usá el botón para buscarlo en Google Maps.
            Si compartís un link desde la app de Maps, pegalo abajo.
        </p>
    </div>
    <div class="location-picker-actions">
        <button type="button" class="btn btn-outline btn-sm location-picker-open-maps">
            Abrir Google Maps
        </button>
    </div>
    <div class="form-group location-picker-url-group">
        <label for="location_url_{{ prefix }}">
            Link de Google Maps <span class="form-label-optional">(opcional)</span>
        </label>
        <input type="url"
               id="location_url_{{ prefix }}"
               name="location_url"
               class="form-control location-picker-url location-picker-url-input"
               placeholder="https://maps.google.com/... o se genera al escribir el lugar"
               {% if value_url %}value="{{ value_url }}"{% endif %}>
    </div>
    <a href="{{ value_url or '#' }}"
       class="location-picker-preview schedule-map-link"
       {% if not value_url %}hidden{% endif %}
       target="_blank"
       rel="noopener noreferrer">Ver en Google Maps ↗</a>
</div>
